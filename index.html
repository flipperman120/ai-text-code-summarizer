<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text & Code Summarizer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Startup Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: slideOut 0.6s ease-in-out forwards;
            animation-delay: 2s;
        }

        #loading-screen.hidden {
            display: none;
        }

        @keyframes slideOut {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100%);
            }
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-logo {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .loading-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .spinner-large {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .dots {
            margin-top: 20px;
            font-size: 1.5em;
        }

        .dot {
            display: inline-block;
            animation: blink 1.4s infinite;
            margin: 0 4px;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
            display: flex;
            max-height: 90vh;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transition: flex 0.3s ease;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
            flex: 1;
            overflow-y: auto;
        }

        /* History Sidebar */
        .history-sidebar {
            width: 300px;
            background: #f5f5f5;
            border-left: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            max-height: 90vh;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .history-sidebar.collapsed {
            width: 50px;
        }

        .history-header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            position: relative;
        }

        .history-header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.3s ease;
        }

        .history-header-title.hidden {
            opacity: 0;
            display: none;
        }

        .toggle-history-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 8px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 35px;
            min-height: 35px;
        }

        .toggle-history-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }

        .clear-history-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid white;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
            margin-left: 5px;
        }

        .clear-history-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .clear-history-btn.hidden {
            display: none;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            transition: opacity 0.3s ease;
        }

        .history-list.collapsed {
            display: none;
        }

        .history-item {
            padding: 12px;
            margin-bottom: 8px;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            border-left: 3px solid #667eea;
            transition: all 0.2s ease;
            font-size: 0.9em;
        }

        .history-item:hover {
            background: #f0f0f0;
            transform: translateX(5px);
        }

        .history-item.active {
            background: #e8f0fe;
            border-left-color: #1f2937;
        }

        .history-item-title {
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }

        .history-item-type {
            font-size: 0.8em;
            color: #999;
            margin-top: 4px;
        }

        .history-item-time {
            font-size: 0.75em;
            color: #bbb;
            margin-top: 4px;
        }

        .history-item-delete {
            display: inline-block;
            background: #f44336;
            color: white;
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75em;
            margin-top: 6px;
        }

        .history-item-delete:hover {
            background: #d32f2f;
        }

        .no-history {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 0.9em;
        }

        /* Collapsed sidebar icon badge */
        .collapsed-icon {
            display: none;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            color: white;
            font-weight: 600;
            padding: 10px 0;
        }

        .history-sidebar.collapsed .collapsed-icon {
            display: block;
            text-align: center;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
            overflow-x: auto;
        }

        .tab-button {
            padding: 15px 30px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            white-space: nowrap;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
            min-height: 200px;
            transition: border-color 0.3s ease;
            background-color: white;
            color: #333;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .checker-buttons {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: nowrap;
        }

        .check-button {
            background: #FF9800;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            white-space: nowrap;
        }

        .check-button:hover:not(:disabled) {
            background: #FB8C00;
            transform: translateY(-2px);
        }

        .check-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .ai-detect-button {
            background: linear-gradient(135deg, #e91e63 0%, #9c27b0 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            white-space: nowrap;
        }

        .ai-detect-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 30, 99, 0.4);
        }

        .ai-detect-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .summarize-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            white-space: nowrap;
        }

        .summarize-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .summarize-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .checker-results {
            margin-top: 15px;
            display: none;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .checker-results.active {
            display: block;
        }

        .grammar-results {
            background: #fff3cd;
            border: 1px solid #ffc107;
        }

        .ai-results {
            background: #f3e5f5;
            border: 2px solid #9c27b0;
        }

        .grammar-item {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #ffe082;
        }

        .grammar-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .grammar-error {
            background: #ffebee;
            color: #c62828;
            padding: 8px;
            border-left: 3px solid #f44336;
            border-radius: 4px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .grammar-suggestion {
            color: #2e7d32;
            padding: 8px;
            background: #e8f5e9;
            border-radius: 4px;
            margin-top: 8px;
        }

        .grammar-message {
            color: #666;
            font-size: 0.9em;
            margin-top: 4px;
        }

        .no-errors {
            color: #2e7d32;
            font-weight: 600;
            padding: 10px;
        }

        /* AI Detection Results Styles */
        .ai-detection-header {
            font-size: 1.3em;
            font-weight: 700;
            margin-bottom: 15px;
            color: #6a1b9a;
            border-bottom: 2px solid #9c27b0;
            padding-bottom: 10px;
        }

        .ai-score-container {
            margin-bottom: 15px;
        }

        .ai-score-label {
            font-weight: 600;
            color: #4a148c;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .ai-score-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #9c27b0;
        }

        .ai-score-fill {
            height: 100%;
            background: linear-gradient(90deg, #e91e63 0%, #9c27b0 100%);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.85em;
        }

        .human-score-fill {
            background: linear-gradient(90deg, #4caf50 0%, #81c784 100%);
        }

        .ai-verdict {
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
            font-weight: 600;
            text-align: center;
            font-size: 1.1em;
        }

        .ai-verdict.likely-ai {
            background: #ffebee;
            color: #c62828;
            border: 2px solid #f44336;
        }

        .ai-verdict.likely-human {
            background: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .ai-verdict.mixed {
            background: #fff3e0;
            color: #e65100;
            border: 2px solid #ff9800;
        }

        .ai-analysis {
            margin-top: 12px;
            padding: 10px;
            background: rgba(156, 39, 176, 0.1);
            border-left: 3px solid #9c27b0;
            border-radius: 4px;
            font-size: 0.9em;
            line-height: 1.6;
            color: #4a148c;
        }

        .ai-features {
            margin-top: 12px;
            font-size: 0.9em;
        }

        .ai-feature {
            margin: 6px 0;
            padding: 6px;
            background: rgba(156, 39, 176, 0.05);
            border-radius: 4px;
        }

        .ai-feature.high {
            background: #ffebee;
            color: #c62828;
        }

        .ai-feature.medium {
            background: #fff3e0;
            color: #e65100;
        }

        .ai-feature.low {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group-item label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-summarize {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-summarize:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
            flex: 0 1 auto;
        }

        .btn-copy:hover:not(:disabled) {
            background: #45a049;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .result-text {
            background: white;
            padding: 15px;
            border-radius: 6px;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-dots {
            font-size: 1.2em;
            color: #999;
        }

        .error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f44336;
            animation: slideIn 0.3s ease;
        }

        .success {
            background: #e8f5e9;
            border-left-color: #4CAF50;
            color: #2e7d32;
            display: none;
            margin-top: 10px;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: block;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f5f7ff;
        }

        .file-label:hover {
            background: #ede9f7;
            border-color: #764ba2;
        }

        .file-label.dragover {
            background: #ede9f7;
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-name {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .history-sidebar {
                width: 100%;
                max-height: 200px;
                border-left: none;
                border-bottom: 1px solid #ddd;
            }

            .history-sidebar.collapsed {
                width: 100%;
                max-height: 50px;
            }

            .input-group {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .checker-buttons {
                flex-direction: column;
            }

            .checker-buttons button {
                width: 100%;
            }

            .loading-title {
                font-size: 1.8em;
            }

            .loading-logo {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <!-- Startup Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">🤖</div>
            <div class="loading-title">AI Summarizer</div>
            <div class="loading-subtitle">Initializing...</div>
            <div class="spinner-large"></div>
            <div class="dots">
                <span class="dot">.</span>
                <span class="dot">.</span>
                <span class="dot">.</span>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="main-content">
            <header>
                <h1>🤖 AI Summarizer & Detector</h1>
                <p>Summarize text, check grammar, and detect AI-written content</p>
            </header>

            <div class="content">
                <!-- Tabs -->
                <div class="tabs">
                    <button class="tab-button active" onclick="switchTab('text-tab')">📄 Text</button>
                    <button class="tab-button" onclick="switchTab('code-tab')">💻 Code</button>
                    <button class="tab-button" onclick="switchTab('file-tab')">📁 File</button>
                </div>

                <!-- Text Tab -->
                <div id="text-tab" class="tab-content active">
                    <div class="form-group">
                        <label for="text-input">Enter your text:</label>
                        <div class="textarea-wrapper">
                            <textarea id="text-input" placeholder="Paste your document, article, or text here..."></textarea>
                        </div>
                        <div class="checker-buttons">
                            <button class="check-button" id="text-check-btn" onclick="checkGrammarText()">✏️ Check Grammar & Spelling</button>
                            <button class="ai-detect-button" id="text-ai-btn" onclick="detectAIText()">🔍 Detect AI Content</button>
                            <button class="summarize-button" id="text-summarize-inline-btn" onclick="summarizeText()">📝 Summarize</button>
                        </div>
                        <div id="text-grammar-results" class="checker-results grammar-results"></div>
                        <div id="text-ai-results" class="checker-results ai-results"></div>
                    </div>

                    <div class="input-group">
                        <div class="input-group-item">
                            <label for="text-min-length">Minimum Summary Length:</label>
                            <input type="number" id="text-min-length" value="50" min="10" max="500">
                        </div>
                        <div class="input-group-item">

    <script>
        // ============ HISTORY MANAGEMENT ============
        const STORAGE_KEY = 'summarizer_history';
        const SIDEBAR_STATE_KEY = 'sidebar_collapsed';
        const MAX_HISTORY_ITEMS = 50;

        class HistoryManager {
            constructor() {
                this.history = this.loadHistory();
                this.renderHistory();
                this.loadSidebarState();
            }

            loadHistory() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.error('Error loading history:', e);
                    return [];
                }
            }

            saveHistory() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(this.history));
                    this.renderHistory();
                } catch (e) {
                    console.error('Error saving history:', e);
                }
            }

            saveSidebarState(collapsed) {
                try {
                    localStorage.setItem(SIDEBAR_STATE_KEY, JSON.stringify(collapsed));
                } catch (e) {
                    console.error('Error saving sidebar state:', e);
                }
            }

            loadSidebarState() {
                try {
                    const state = localStorage.getItem(SIDEBAR_STATE_KEY);
                    if (state !== null) {
                        const collapsed = JSON.parse(state);
                        if (collapsed) {
                            this.collapseSidebar();
                        }
                    }
                } catch (e) {
                    console.error('Error loading sidebar state:', e);
                }
            }

            addItem(content, summary, type, language = '') {
                const item = {
                    id: Date.now(),
                    content: content.substring(0, 500),
                    summary: summary,
                    type: type,
                    language: language,
                    timestamp: new Date().toISOString(),
                    title: content.substring(0, 50).replace(/\n/g, ' ') + (content.length > 50 ? '...' : '')
                };

                this.history.unshift(item);
                if (this.history.length > MAX_HISTORY_ITEMS) {
                    this.history.pop();
                }
                this.saveHistory();
            }

            removeItem(id) {
                this.history = this.history.filter(item => item.id !== id);
                this.saveHistory();
            }

            clearAll() {
                if (confirm('Are you sure you want to clear all history? This cannot be undone.')) {
                    this.history = [];
                    this.saveHistory();
                }
            }

            getItem(id) {
                return this.history.find(item => item.id === id);
            }

            collapseSidebar() {
                const sidebar = document.getElementById('history-sidebar');
                const list = document.getElementById('history-list');
                const icon = document.getElementById('toggle-icon');
                const title = document.querySelector('.history-header-title');
                const clearBtn = document.querySelector('.clear-history-btn');

                sidebar.classList.add('collapsed');
                list.classList.add('collapsed');
                title.classList.add('hidden');
                clearBtn.classList.add('hidden');
                icon.textContent = '▶';

                this.saveSidebarState(true);
            }

            expandSidebar() {
                const sidebar = document.getElementById('history-sidebar');
                const list = document.getElementById('history-list');
                const icon = document.getElementById('toggle-icon');
                const title = document.querySelector('.history-header-title');
                const clearBtn = document.querySelector('.clear-history-btn');

                sidebar.classList.remove('collapsed');
                list.classList.remove('collapsed');
                title.classList.remove('hidden');
                clearBtn.classList.remove('hidden');
                icon.textContent = '◀';

                this.saveSidebarState(false);
            }

            toggleSidebar() {
                const sidebar = document.getElementById('history-sidebar');
                if (sidebar.classList.contains('collapsed')) {
                    this.expandSidebar();
                } else {
                    this.collapseSidebar();
                }
            }

            renderHistory() {
                const historyList = document.getElementById('history-list');
                if (this.history.length === 0) {
                    historyList.innerHTML = '<div class="no-history">No history yet</div>';
                    return;
                }

                historyList.innerHTML = this.history.map(item => `
                    <div class="history-item" onclick="loadHistoryItem(${item.id})">
                        <div class="history-item-title" title="${item.title}">${item.title}</div>
                        <div class="history-item-type">
                            ${item.type === 'text' ? '📄' : item.type === 'code' ? '💻' : '📁'}
                            ${item.type.charAt(0).toUpperCase() + item.type.slice(1)}
                            ${item.language ? ` (${item.language})` : ''}
                        </div>
                        <div class="history-item-time">${formatTime(item.timestamp)}</div>
                        <button class="history-item-delete" onclick="event.stopPropagation(); historyManager.removeItem(${item.id})">Delete</button>
                    </div>
                `).join('');
            }
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);

            if (seconds < 60) return 'just now';
            if (minutes < 60) return `${minutes}m ago`;
            if (hours < 24) return `${hours}h ago`;
            if (days < 7) return `${days}d ago`;
            return date.toLocaleDateString();
        }

        function loadHistoryItem(id) {
            const item = historyManager.getItem(id);

        // AI Detection Function
        async function detectAI(text, elementId) {
            const resultsElement = document.getElementById(elementId);

            if (!text.trim()) {
                showError('text-error', 'Please enter some text to analyze.');

            resultsElement.innerHTML = '<div style="text-align: center; padding: 10px;"><div class="spinner"></div><span class="loading-text">Analyzing text for AI markers...</span></div>';
            resultsElement.classList.add('active');

            try {
                // AI Detection Analysis
                const analysis = analyzeTextForAI(text);

                // Display Results
                let resultHTML = `
                    <div class="ai-detection-header">🔍 AI Detection Analysis</div>
                    
                    <div class="ai-score-container">

                                ${(100 - analysis.aiScore) > 15 ? (100 - analysis.aiScore).toFixed(1) + '%' : ''}
                            </div>
                        </div>
                    </div>

                    <div class="ai-verdict ${analysis.verdict}">
                        ${analysis.verdictText}
                    </div>

                    <div class="ai-analysis">
                        <strong>Analysis:</strong> ${analysis.analysis}
                    </div>

                    <div class="ai-features">
                        <strong>Key Indicators:</strong>
                        ${analysis.features.map(f => `<div class="ai-feature ${f.level}">• ${f.name}: ${f.description}</div>`).join('')}
                    </div>
                `;

                resultsElement.innerHTML = resultHTML;
            } catch (error) {
                showError('text-error', 'Error analyzing text for AI content.');
            } finally {
                aiBtn.disabled = false;
            }
        }

        function analyzeTextForAI(text) {
            const words = text.toLowerCase().split(/\s+/);
            const sentences = text.split(/[.!?]+/).filter(s => s.trim());
            
            let aiScore = 0;
            const features = [];

            // Check for AI patterns
            const aiPatterns = {
                'Passive voice': { regex: /\b(is|are|was|were)\s+\w+ed\b/g, weight: 2 },
                'Complex vocabulary': { regex: /\b(notwithstanding|aforementioned|cognizant|utilized)\b/g, weight: 3 },
                'Perfect transitions': { regex: /\b(furthermore|moreover|nevertheless|consequently)\b/g, weight: 2 },
                'Repetitive structure': { regex: null, weight: 0 }
            };

            // Analyze vocabulary complexity
            const complexWords = text.match(/\b[a-z]{10,}\b/gi) || [];
            if (complexWords.length / words.length > 0.15) {
                aiScore += 15;
                features.push({
                    name: 'Complex Vocabulary',
                    description: 'Uses sophisticated terminology',
                    level: 'high'
                });
            }

            // Analyze passive voice
            const passiveMatches = text.match(/\b(is|are|was|were)\s+\w+ed\b/gi) || [];
            if (passiveMatches.length / sentences.length > 0.3) {
                aiScore += 20;
                features.push({
                    name: 'Passive Voice Usage',
                    description: 'Frequent use of passive constructions',
                    level: 'high'
                });
            }

            // Analyze sentence length
            const avgSentenceLength = words.length / sentences.length;
            if (avgSentenceLength > 20) {
                aiScore += 10;
                features.push({
                    name: 'Long Sentences',
                    description: 'Average sentence exceeds 20 words',
                    level: 'medium'
                });
            }

            // Analyze repetitive patterns
            const wordFreq = {};
            words.forEach(word => {
                if (word.length > 3) {
                    wordFreq[word] = (wordFreq[word] || 0) + 1;
                }
            });

            const repetitiveWords = Object.values(wordFreq).filter(count => count > 3).length;
            if (repetitiveWords / Object.keys(wordFreq).length > 0.2) {
                aiScore += 12;
                features.push({
                    name: 'Repetitive Patterns',
                    description: 'Similar words appear frequently',
                    level: 'medium'
                });
            }

            // Human indicators
            if (text.match(/\b(I|me|my|we|us|our)\b/gi)) {
                aiScore -= 15;
                features.push({
                    name: 'Personal Pronouns',
                    description: 'Contains first-person perspective',
                    level: 'low'
                });
            }

            if (text.match(/[!?]{2,}|\.{3,}/g)) {
                aiScore -= 10;
                features.push({
                    name: 'Emotional Expression',
                    description: 'Uses emphatic punctuation',
                    level: 'low'
                });
            }

            aiScore = Math.max(0, Math.min(100, aiScore));

            let verdict = 'mixed';
            let verdictText = '⚠️ Mixed Indicators';

            if (aiScore > 70) {
                verdict = 'likely-ai';
                verdictText = '🤖 Likely AI-Generated';
            } else if (aiScore < 30) {
                verdict = 'likely-human';
                verdictText = '✍️ Likely Human-Written';
            }

            return {
                aiScore,
                verdict,
                verdictText,
                analysis: aiScore > 70 
                    ? 'This text exhibits multiple characteristics commonly found in AI-generated content, including extensive passive voice usage, formal vocabulary, and structured sentence patterns.'
                    : aiScore < 30
                    ? 'This text shows strong indicators of human authorship, including personal perspective, natural language patterns, and authentic expression.'
                    : 'This text contains mixed indicators, with both human and AI-like characteristics present.',
                features
            };
        }

        // Generate Summary (Mock function)
        function generateSummary(text, minLength, maxLength) {
            const sentences = text.match(/[^.!?]+[.!?]+/g) || [];
            if (sentences.length === 0) return text;

            const scored = sentences.map((sentence, index) => ({
                sentence: sentence.trim(),
                score: calculateSentenceScore(sentence, text),
                index
            })).sort((a, b) => b.score - a.score);

            const selectedSentences = scored.slice(0, Math.ceil(sentences.length * 0.4))
                .sort((a, b) => a.index - b.index)
                .map(s => s.sentence)
                .join(' ');

            if (selectedSentences.length < minLength) {
                return selectedSentences + ' ' + sentences.slice(0, 2).join(' ');
            }

            return selectedSentences.substring(0, maxLength) + (selectedSentences.length > maxLength ? '...' : '');
        }

        function generateCodeSummary(code, language, minLength, maxLength) {
            const lines = code.split('\n').filter(line => line.trim());
            const comments = lines.filter(line => /^\s*(\/\/|#|\/\*|\*)/.test(line)).map(l => l.trim());
            
            let summary = `Code snippet in ${language || 'unknown language'}:\n`;
            
            if (comments.length > 0) {
                summary += 'Comments and documentation:\n' + comments.slice(0, 3).join('\n') + '\n\n';
            }

            const functionMatches = code.match(/(?:function|def|class|interface)\s+\w+/gi) || [];
            if (functionMatches.length > 0) {
                summary += 'Key components: ' + [...new Set(functionMatches)].slice(0, 5).join(', ');
            }

            if (summary.length < minLength) {
                summary += '\n\nCode overview: This snippet contains ' + lines.length + ' lines of code with ' + functionMatches.length + ' major components.';
            }

            return summary.substring(0, maxLength) + (summary.length > maxLength ? '...' : '');
        }

        function calculateSentenceScore(sentence, text) {
            const words = sentence.toLowerCase().split(/\s+/);
            const textWords = text.toLowerCase().split(/\s+/);
            const wordFreq = {};

            textWords.forEach(word => {
                wordFreq[word] = (wordFreq[word] || 0) + 1;
            });

            let score = 0;
            words.forEach(word => {
                score += (wordFreq[word] || 0) * (word.length > 3 ? 2 : 1);
            });

            return score / words.length;
        }

        // Check Grammar Text
        async function checkGrammarText() {
            const text = document.getElementById('text-input').value;
            const resultsDiv = document.getElementById('text-grammar-results');

            if (!text.trim()) {

                const issues = checkGrammar(text);
                
                if (issues.length === 0) {
                    resultsDiv.innerHTML = '<div class="no-errors">✅ No grammar or spelling errors found!</div>';
                } else {
                    resultsDiv.innerHTML = issues.map((issue, index) => `
                        <div class="grammar-item">
                            <div class="grammar-error">Error ${index + 1}: ${issue.error}</div>
                            <div class="grammar-suggestion">✓ Suggestion: ${issue.suggestion}</div>
                            <div class="grammar-message">${issue.message}</div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showError('text-error', 'Error checking grammar. Please try again.');
            }
        }

        function checkGrammar(text) {
            const issues = [];

            // Simple grammar checks
            const patterns = [
                { regex: /\ba\s+[aeiou]/g, error: 'Use "an" before vowels', suggestion: 'Replace "a" with "an"', message: 'Articles should match the following word' },
                { regex: /\s{2,}/g, error: 'Double spaces detected', suggestion: 'Use single spaces', message: 'Multiple consecutive spaces found' },
                { regex: /\b(their|there|they're)\s+not\b/g, error: 'Check "their/there/they\'re" usage', suggestion: 'Verify correct spelling', message: 'Common homophone error' }
            ];

            patterns.forEach(pattern => {
                const matches = text.match(pattern.regex) || [];
                matches.forEach((match, index) => {
                    if (index < 3) {
                        issues.push({
                            error: pattern.error,
                            suggestion: pattern.suggestion,
                            message: pattern.message
                        });
                    }
                });
            });

            return issues.slice(0, 5);
        }

        // Detect AI Text
        async function detectAIText() {
            const text = document.getElementById('text-input').value;
            await detectAI(text, 'text-ai-results');
        }

        // Copy Summary
        function copySummary(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                showSuccess('Summary copied to clipboard!');
            }).catch(() => {
                showError('text-error', 'Failed to copy text.');
            });
        }

        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.style.cssText = 'position: fixed; top: 20px; right: 20px; background: #e8f5e9; color: #2e7d32; padding: 15px; border-radius: 6px; border-left: 4px solid #4CAF50; z-index: 10000;';
            successDiv.textContent = message;
            document.body.appendChild(successDiv);

            setTimeout(() => successDiv.remove(), 3000);
        }

        // Show Error
        function showError(elementId, message) {
            const errorDiv = document.getElementById(elementId);
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }
        }

        // Clear Functions
        function clearText() {
            document.getElementById('text-input').value = '';
            document.getElementById('text-result').style.display = 'none';
            document.getElementById('text-error').style.display = 'none';
        }

        function clearCode() {
            document.getElementById('code-input').value = '';
            document.getElementById('code-result').style.display = 'none';
            document.getElementById('code-error').style.display = 'none';
        }

        function clearFile() {
            document.getElementById('file-input').value = '';
            document.getElementById('file-name').textContent = '';
            document.getElementById('file-result').style.display = 'none';
            document.getElementById('file-error').style.display = 'none';
        }

        // File handling
        const fileLabel = document.getElementById('file-label');
        const fileInput = document.getElementById('file-input');

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.classList.add('dragover');
        });

        fileLabel.addEventListener('dragleave', () => {
            fileLabel.classList.remove('dragover');
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                document.getElementById('file-name').textContent = files[0].name;
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                document.getElementById('file-name').textContent = e.target.files[0].name;
            }
        });
    </script>
</body>
</html>
