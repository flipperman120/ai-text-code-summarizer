<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text & Code Summarizer</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Startup Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: slideOut 0.6s ease-in-out forwards;
            animation-delay: 2s;
        }

        #loading-screen.hidden {
            display: none;
        }

        @keyframes slideOut {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100%);
            }
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-logo {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .loading-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .loading-subtitle {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .spinner-large {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        .dots {
            margin-top: 20px;
            font-size: 1.5em;
        }

        .dot {
            display: inline-block;
            animation: blink 1.4s infinite;
            margin: 0 4px;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            padding: 15px 30px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-button:hover {
            color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.95em;
            resize: vertical;
            min-height: 200px;
            transition: border-color 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group-item label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-summarize {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-summarize:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }

        .btn-clear:hover:not(:disabled) {
            background: #e0e0e0;
        }

        .btn-copy {
            background: #4CAF50;
            color: white;
            flex: 0 1 auto;
        }

        .btn-copy:hover:not(:disabled) {
            background: #45a049;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .result-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .result-text {
            background: white;
            padding: 15px;
            border-radius: 6px;
            line-height: 1.6;
            color: #555;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1em;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .loading-dots {
            font-size: 1.2em;
            color: #999;
        }

        .error {
            background: #ffebee;
            border-left-color: #f44336;
            color: #c62828;
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #f44336;
            animation: slideIn 0.3s ease;
        }

        .success {
            background: #e8f5e9;
            border-left-color: #4CAF50;
            color: #2e7d32;
            display: none;
            margin-top: 10px;
            padding: 15px;
            border-radius: 6px;
            border-left: 4px solid #4CAF50;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .file-label {
            display: block;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f5f7ff;
        }

        .file-label:hover {
            background: #ede9f7;
            border-color: #764ba2;
        }

        .file-label.dragover {
            background: #ede9f7;
            border-color: #764ba2;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .file-name {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 20px;
            }

            .button-group {
                flex-direction: column;
            }

            .loading-title {
                font-size: 1.8em;
            }

            .loading-logo {
                font-size: 3em;
            }
        }
    </style>
</head>
<body>
    <!-- Startup Loading Screen -->
    <div id="loading-screen">
        <div class="loading-content">
            <div class="loading-logo">🤖</div>
            <div class="loading-title">AI Summarizer</div>
            <div class="loading-subtitle">Initializing...</div>
            <div class="spinner-large"></div>
            <div class="dots">
                <span class="dot">.</span>
                <span class="dot">.</span>
                <span class="dot">.</span>
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>🤖 AI Summarizer</h1>
            <p>Summarize text documents and code instantly</p>
        </header>

        <div class="content">
            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-button active" onclick="switchTab('text-tab')">📄 Text</button>
                <button class="tab-button" onclick="switchTab('code-tab')">💻 Code</button>
                <button class="tab-button" onclick="switchTab('file-tab')">📁 File</button>
            </div>

            <!-- Text Tab -->
            <div id="text-tab" class="tab-content active">
                <div class="form-group">
                    <label for="text-input">Enter your text:</label>
                    <textarea id="text-input" placeholder="Paste your document, article, or text here..."></textarea>
                </div>

                <div class="input-group">
                    <div class="input-group-item">
                        <label for="text-min-length">Minimum Summary Length:</label>
                        <input type="number" id="text-min-length" value="50" min="10" max="500">
                    </div>
                    <div class="input-group-item">
                        <label for="text-max-length">Maximum Summary Length:</label>
                        <input type="number" id="text-max-length" value="150" min="50" max="500">
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-summarize" id="text-summarize-btn" onclick="summarizeText()">Summarize</button>
                    <button class="btn-clear" onclick="clearText()">Clear</button>
                </div>

                <div id="text-loading" class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Summarizing your text</div>
                    <div class="loading-dots">
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                    </div>
                </div>

                <div id="text-error" class="error"></div>

                <div id="text-result" class="result-section" style="display: none;">
                    <h3>Summary</h3>
                    <div class="button-group" style="margin-bottom: 15px;">
                        <button class="btn-copy" onclick="copySummary('text-summary')">📋 Copy</button>
                    </div>
                    <div id="text-summary" class="result-text"></div>
                </div>
            </div>

            <!-- Code Tab -->
            <div id="code-tab" class="tab-content">
                <div class="form-group">
                    <label for="code-language">Programming Language:</label>
                    <select id="code-language">
                        <option value="">Auto-detect</option>
                        <option value="python">Python</option>
                        <option value="javascript">JavaScript</option>
                        <option value="java">Java</option>
                        <option value="cpp">C++</option>
                        <option value="csharp">C#</option>
                        <option value="ruby">Ruby</option>
                        <option value="php">PHP</option>
                        <option value="go">Go</option>
                        <option value="rust">Rust</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="code-input">Enter your code:</label>
                    <textarea id="code-input" placeholder="Paste your code here..."></textarea>
                </div>

                <div class="input-group">
                    <div class="input-group-item">
                        <label for="code-min-length">Minimum Summary Length:</label>
                        <input type="number" id="code-min-length" value="50" min="10" max="500">
                    </div>
                    <div class="input-group-item">
                        <label for="code-max-length">Maximum Summary Length:</label>
                        <input type="number" id="code-max-length" value="150" min="50" max="500">
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-summarize" id="code-summarize-btn" onclick="summarizeCode()">Summarize</button>
                    <button class="btn-clear" onclick="clearCode()">Clear</button>
                </div>

                <div id="code-loading" class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Summarizing your code</div>
                    <div class="loading-dots">
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                    </div>
                </div>

                <div id="code-error" class="error"></div>

                <div id="code-result" class="result-section" style="display: none;">
                    <h3>Summary</h3>
                    <div class="button-group" style="margin-bottom: 15px;">
                        <button class="btn-copy" onclick="copySummary('code-summary')">📋 Copy</button>
                    </div>
                    <div id="code-summary" class="result-text"></div>
                </div>
            </div>

            <!-- File Tab -->
            <div id="file-tab" class="tab-content">
                <div class="file-upload">
                    <label for="file-input" class="file-label" id="file-label">
                        <div>📤 Drag and drop your file here or click to select</div>
                        <div class="file-name" id="file-name"></div>
                    </label>
                    <input type="file" id="file-input" class="file-input" accept=".txt,.py,.js,.java,.cpp,.cs,.rb,.php,.go,.rs,.md">
                </div>

                <div class="input-group">
                    <div class="input-group-item">
                        <label for="file-min-length">Minimum Summary Length:</label>
                        <input type="number" id="file-min-length" value="50" min="10" max="500">
                    </div>
                    <div class="input-group-item">
                        <label for="file-max-length">Maximum Summary Length:</label>
                        <input type="number" id="file-max-length" value="150" min="50" max="500">
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn-summarize" id="file-summarize-btn" onclick="summarizeFile()">Summarize</button>
                    <button class="btn-clear" onclick="clearFile()">Clear</button>
                </div>

                <div id="file-loading" class="loading">
                    <div class="spinner"></div>
                    <div class="loading-text">Summarizing your file</div>
                    <div class="loading-dots">
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                        <span class="dot">.</span>
                    </div>
                </div>

                <div id="file-error" class="error"></div>

                <div id="file-result" class="result-section" style="display: none;">
                    <h3>Summary</h3>
                    <div class="button-group" style="margin-bottom: 15px;">
                        <button class="btn-copy" onclick="copySummary('file-summary')">📋 Copy</button>
                    </div>
                    <div id="file-summary" class="result-text"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Hide loading screen on page load
        window.addEventListener('load', () => {
            const loadingScreen = document.getElementById('loading-screen');
            setTimeout(() => {
                loadingScreen.classList.add('hidden');
            }, 2000);
        });

        // Tab switching
        function switchTab(tabName) {
            const tabs = document.querySelectorAll('.tab-content');
            tabs.forEach(tab => tab.classList.remove('active'));

            const buttons = document.querySelectorAll('.tab-button');
            buttons.forEach(btn => btn.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // Text Summarization
        async function summarizeText() {
            const text = document.getElementById('text-input').value.trim();
            const minLength = parseInt(document.getElementById('text-min-length').value);
            const maxLength = parseInt(document.getElementById('text-max-length').value);

            if (!text) {
                showError('text-error', 'Please enter some text to summarize.');
                return;
            }

            await sendSummarizeRequest('text', text, minLength, maxLength, 'text');
        }

        // Code Summarization
        async function summarizeCode() {
            const code = document.getElementById('code-input').value.trim();
            const language = document.getElementById('code-language').value;
            const minLength = parseInt(document.getElementById('code-min-length').value);
            const maxLength = parseInt(document.getElementById('code-max-length').value);

            if (!code) {
                showError('code-error', 'Please enter some code to summarize.');
                return;
            }

            await sendSummarizeRequest('code', code, minLength, maxLength, 'code', language);
        }

        // File Summarization
        async function summarizeFile() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files.length) {
                showError('file-error', 'Please select a file to summarize.');
                return;
            }

            const file = fileInput.files[0];
            const minLength = parseInt(document.getElementById('file-min-length').value);
            const maxLength = parseInt(document.getElementById('file-max-length').value);

            const reader = new FileReader();
            reader.onload = async (e) => {
                const content = e.target.result;
                const type = file.name.endsWith('.py') ? 'code' : file.name.endsWith('.js') || file.name.endsWith('.cpp') || file.name.endsWith('.java') ? 'code' : 'text';
                await sendSummarizeRequest('file', content, minLength, maxLength, type);
            };
            reader.readAsText(file);
        }

        // Send summarization request
        async function sendSummarizeRequest(endpoint, content, minLength, maxLength, type, language = '') {
            const loadingId = `${endpoint}-loading`;
            const errorId = `${endpoint}-error`;
            const resultId = `${endpoint}-result`;
            const summaryId = `${endpoint}-summary`;
            const btnId = `${endpoint}-summarize-btn`;

            // Show loading state and disable button
            document.getElementById(loadingId).classList.add('active');
            document.getElementById(errorId).style.display = 'none';
            document.getElementById(resultId).style.display = 'none';
            document.getElementById(btnId).disabled = true;

            try {
                // Simulate AI summarization with delay
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                const summary = generateMockSummary(content, minLength, maxLength);

                // Hide loading and re-enable button
                document.getElementById(loadingId).classList.remove('active');
                document.getElementById(btnId).disabled = false;

                // Show result
                document.getElementById(summaryId).textContent = summary;
                document.getElementById(resultId).style.display = 'block';

                // Show success message
                showSuccess(errorId, '✓ Summary generated successfully!');
            } catch (error) {
                document.getElementById(loadingId).classList.remove('active');
                document.getElementById(btnId).disabled = false;
                showError(errorId, '❌ Error: ' + error.message);
            }
        }

        // Mock summarization function
        function generateMockSummary(content, minLength, maxLength) {
            const sentences = content.match(/[^.!?]+[.!?]+/g) || [content];
            let summary = '';
            let length = 0;

            for (let sentence of sentences) {
                summary += sentence.trim() + ' ';
                length += sentence.length;
                if (length >= minLength) break;
            }

            if (summary.length > maxLength) {
                summary = summary.substring(0, maxLength) + '...';
            }

            return summary.trim() || 'Unable to generate summary.';
        }

        // Copy summary to clipboard
        function copySummary(elementId) {
            const text = document.getElementById(elementId).textContent;
            navigator.clipboard.writeText(text).then(() => {
                showSuccess('text-error', '📋 Copied to clipboard!');
                setTimeout(() => {
                    document.getElementById('text-error').style.display = 'none';
                }, 2000);
            });
        }

        // Show error message
        function showError(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.style.display = 'block';
        }

        // Show success message
        function showSuccess(elementId, message) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = 'success';
            element.style.display = 'block';
            setTimeout(() => {
                element.style.display = 'none';
                element.className = 'error';
            }, 3000);
        }

        // Clear functions
        function clearText() {
            document.getElementById('text-input').value = '';
            document.getElementById('text-result').style.display = 'none';
            document.getElementById('text-error').style.display = 'none';
            document.getElementById('text-loading').classList.remove('active');
        }

        function clearCode() {
            document.getElementById('code-input').value = '';
            document.getElementById('code-result').style.display = 'none';
            document.getElementById('code-error').style.display = 'none';
            document.getElementById('code-loading').classList.remove('active');
        }

        function clearFile() {
            document.getElementById('file-input').value = '';
            document.getElementById('file-name').textContent = '';
            document.getElementById('file-result').style.display = 'none';
            document.getElementById('file-error').style.display = 'none';
            document.getElementById('file-loading').classList.remove('active');
        }

        // File drag and drop
        const fileLabel = document.getElementById('file-label');
        const fileInput = document.getElementById('file-input');

        fileLabel.addEventListener('dragover', (e) => {
            e.preventDefault();
            fileLabel.classList.add('dragover');
        });

        fileLabel.addEventListener('dragleave', () => {
            fileLabel.classList.remove('dragover');
        });

        fileLabel.addEventListener('drop', (e) => {
            e.preventDefault();
            fileLabel.classList.remove('dragover');
            fileInput.files = e.dataTransfer.files;
            updateFileName();
        });

        fileInput.addEventListener('change', updateFileName);

        function updateFileName() {
            const fileName = fileInput.files.length > 0 ? fileInput.files[0].name : '';
            document.getElementById('file-name').textContent = fileName ? `✓ ${fileName}` : '';
        }

        // Keyboard shortcuts - Ctrl+Enter or Cmd+Enter
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                const activeTab = document.querySelector('.tab-content.active').id;
                if (activeTab === 'text-tab') summarizeText();
                else if (activeTab === 'code-tab') summarizeCode();
                else if (activeTab === 'file-tab') summarizeFile();
            }
        });
    </script>
</body>
</html>
